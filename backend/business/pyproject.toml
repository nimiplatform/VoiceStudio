[project]
name = "voicestudio-business"
version = "0.5.9"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.136,<0.137", "uvicorn>=0.35", "python-multipart>=0.0.31",
  "numpy>=2.2", "soundfile>=0.13", "soxr>=0.5", "pillow>=12.1", "pydub>=0.25",
  "imageio-ffmpeg>=0.6", "pedalboard>=0.9.14", "yt-dlp>=2026.7.4", "pypdf>=4", "websockets>=15", "alembic>=1.16",
  "psutil>=7.2.2", "cryptography>=41", "httpx>=0.28", "platformdirs>=4",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.19"]
